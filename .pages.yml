media:
  input: media
  output: /media

content:
  - name: website
    label: Edit Northbound Website
    type: file
    path: content/site.json
    format: json
    fields:
      - name: business
        label: Business details
        type: object
        fields:
          - { name: name, label: Business name, type: string }
          - { name: location, label: Location, type: string }
          - { name: whatsapp, label: WhatsApp number, type: string, description: "Use country code without + or spaces, e.g. 27718874432" }
          - { name: instagram, label: Instagram, type: string }
          - { name: website, label: Website address, type: string }
          - { name: founder, label: Founder name, type: string }
      - name: hero
        label: Homepage introduction
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string }
          - { name: heading, label: Main heading, type: string }
          - { name: description, label: Introduction, type: text }
          - { name: serviceLine, label: Service summary line, type: string }
      - name: services
        label: Main services
        type: object
        list: true
        fields:
          - { name: name, label: Service name, type: string }
          - { name: price, label: Price, type: string }
          - { name: description, label: Description, type: text }
          - { name: bestFor, label: Best for / final note, type: text }
      - name: deepCleanPrices
        label: Deep-clean prices
        type: object
        list: true
        fields:
          - { name: label, label: Property size, type: string }
          - { name: price, label: Price, type: string }
      - name: extras
        label: Linen change, linen ironing and laundry drop-off
        type: object
        fields:
          - { name: heading, label: Section heading, type: string }
          - { name: linenChangeHeading, label: Linen-change heading, type: string }
          - { name: linenChange, label: Linen-change prices, type: string }
          - { name: linenIroningHeading, label: Linen-ironing heading, type: string }
          - { name: linenIroning, label: Linen-ironing price, type: string }
          - { name: linenLaundryHeading, label: Laundry-drop-off heading, type: string }
          - { name: linenLaundry, label: Laundry-drop-off details, type: text }
          - { name: note, label: Linen and laundry note, type: text }
          - name: windowWashing
            label: Window washing with Deep Cleans
            type: object
            fields:
              - { name: largeHomeAddon, label: Window add-on price for 3+ bedrooms (rand), type: number }
              - { name: scope, label: Window washing scope, type: text }
      - name: bookingExtras
        label: Booking extras
        type: object
        list: true
        fields:
          - { name: name, label: Extra name, type: string }
          - { name: description, label: Description, type: text }
          - name: pricing
            label: Pricing method
            type: select
            options: [fixed, bedrooms, quote]
          - { name: price, label: Fixed price (rand), type: number }
          - { name: smallHomePrice, label: Price for 1–3 bedrooms (rand), type: number }
          - { name: largeHomePrice, label: Price for 4+ bedrooms (rand), type: number }
      - name: propertyServices
        label: Property services
        type: object
        list: true
        fields:
          - { name: name, label: Service name, type: string }
          - { name: description, label: Description, type: text }
          - { name: button, label: Button wording, type: string }
          - { name: whatsappPrompt, label: WhatsApp message, type: text }
      - name: about
        label: About Northbound
        type: object
        fields:
          - { name: heading, label: About heading, type: string }
          - name: paragraphs
            label: About paragraphs
            type: text
            list: true
      - name: faqs
        label: Frequently asked questions
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

  - name: availability
    label: Booking availability
    type: file
    path: content/availability.json
    format: json
    fields:
      - { name: enabled, label: Accept booking requests, type: boolean }
      - { name: whatsapp, label: Booking WhatsApp number, type: string, description: "Country code and number only. Check this is your current business number." }
      - name: availableDates
        label: Available dates
        type: string
        list: true
        description: "Add dates as YYYY-MM-DD, e.g. 2026-11-02. Only listed dates open for requests. Remove dates when fully booked. Sundays remain closed. Never enter customer information here."

settings:
  hide: false
  commit:
    identity: user
